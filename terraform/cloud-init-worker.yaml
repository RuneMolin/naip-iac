#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl

runcmd:
  # Wait for master to be ready (retry for up to 5 minutes)
  - for i in {1..60}; do nc -zv ${master_ip} 6443 && break || sleep 5; done
  
  # Get k3s join token from master
  - until K3S_TOKEN=$(ssh -o StrictHostKeyChecking=no root@${master_ip} "cat /var/lib/rancher/k3s/server/node-token" 2>/dev/null); do sleep 10; done
  
  # Install k3s agent
  - curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="v${k8s_version}" K3S_URL=https://${master_ip}:6443 K3S_TOKEN=$K3S_TOKEN sh -s - agent
  
  # Label worker node
  - sleep 30
