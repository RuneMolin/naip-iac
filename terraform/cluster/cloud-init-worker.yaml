#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates

runcmd:
  # Wait for master API server to be responsive (up to 5 minutes)
  - for i in $(seq 1 60); do curl -k -s --connect-timeout 5 https://${master_ip}:6443/ping && break || sleep 5; done

  # Install k3s agent
  - curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL="${k8s_channel}" K3S_URL="https://${master_ip}:6443" K3S_TOKEN="${k3s_token}" sh -s - agent --node-name="${node_name}" --node-ip="${node_ip}"
