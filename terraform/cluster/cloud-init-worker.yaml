#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates

runcmd:
  # Disable IPv6 to prevent dual-stack image pull issues from registries
  - sysctl -w net.ipv6.conf.all.disable_ipv6=1
  - sysctl -w net.ipv6.conf.default.disable_ipv6=1
  - echo 'net.ipv6.conf.all.disable_ipv6 = 1' >> /etc/sysctl.d/99-disable-ipv6.conf
  - echo 'net.ipv6.conf.default.disable_ipv6 = 1' >> /etc/sysctl.d/99-disable-ipv6.conf

  # Ensure private network interface is up
  - ip link set enp7s0 up || true
  - dhclient enp7s0 || true

  # Wait for master API server to be responsive (up to 5 minutes)
  - for i in $(seq 1 60); do curl -k -s --connect-timeout 5 https://${master_ip}:6443/ping && break || sleep 5; done

  # Install k3s agent
  - curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL="${k8s_channel}" K3S_URL="https://${master_ip}:6443" K3S_TOKEN="${k3s_token}" sh -s - agent --node-name="${node_name}" --node-ip="${node_ip}" --flannel-iface="enp7s0" --kubelet-arg="cloud-provider=external"
