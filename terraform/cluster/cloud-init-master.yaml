#cloud-config
package_update: true
package_upgrade: true

packages:
  - curl
  - apt-transport-https
  - ca-certificates

write_files:
  - path: /etc/rancher/k3s/config.yaml
    content: |
      cluster-init: true
      tls-san:
        - "${node_ip}"
        - "${lb_ip}"
      token: "${k3s_token}"
      disable:
        - traefik
        - servicelb
      disable-cloud-controller: true
      kubelet-arg:
        - "cloud-provider=external"
      flannel-iface: "enp7s0"
      node-ip: "${node_ip}"
      advertise-address: "${node_ip}"
      cluster-cidr: "${cluster_cidr}"
      service-cidr: "${service_cidr}"
      flannel-backend: "vxlan"
      node-name: "${cluster_name}-master"

runcmd:
  # Disable IPv6 to prevent dual-stack image pull issues from registries
  - sysctl -w net.ipv6.conf.all.disable_ipv6=1
  - sysctl -w net.ipv6.conf.default.disable_ipv6=1
  - echo 'net.ipv6.conf.all.disable_ipv6 = 1' >> /etc/sysctl.d/99-disable-ipv6.conf
  - echo 'net.ipv6.conf.default.disable_ipv6 = 1' >> /etc/sysctl.d/99-disable-ipv6.conf

  # Fetch public IP from Hetzner metadata to include in TLS SAN
  - PUBLIC_IP=$(curl -s --connect-timeout 5 http://169.254.169.254/hetzner/v1/metadata/public-ipv4 || true)

  # Install k3s server
  - curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL="${k8s_channel}" sh -s - server --config /etc/rancher/k3s/config.yaml $${PUBLIC_IP:+--tls-san "$PUBLIC_IP"}

  # Wait for k3s and kubectl to be ready (up to 30 retries = 2.5 minutes)
  - for i in $(seq 1 30); do /usr/local/bin/kubectl get nodes && break || sleep 5; done

  # Create namespace for system components
  - /usr/local/bin/kubectl create namespace kafka || true
  - /usr/local/bin/kubectl create namespace argocd || true
  - /usr/local/bin/kubectl create namespace cert-manager || true

  # Set cluster labels
  - /usr/local/bin/kubectl label node ${cluster_name}-master node-role.kubernetes.io/master=true --overwrite || true
